name: Publish to Chrome Web Store

# Runs when manifest.json changes on main, and only uploads if its "version" actually went up —
# ordinary commits (README edits, etc.) never send anything to the store. The store keys live in
# this repo's Actions secrets: EXTENSION_ID, PUBLISHER_ID, CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN.
# After a successful upload it tags the version (v1.2.3) and creates its GitHub Release: that
# version's section of CHANGELOG.md, followed by the pull requests merged since the last release.
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch: # "Run workflow" button — publishes the current version without the version check

permissions:
  contents: write # to tag the version and create its GitHub Release

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need the previous commit to compare versions

      - name: Did the version change?
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          now=$(jq -r .version manifest.json)
          echo "version=$now" >> "$GITHUB_OUTPUT"
          before=$(git show "$BEFORE_SHA:manifest.json" 2>/dev/null | jq -r .version 2>/dev/null || true)
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$now" != "$before" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing version $now (previous: ${before:-none})"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($now) — nothing to publish"
          fi

      - name: Build the store zip
        if: steps.version.outputs.publish == 'true'
        run: zip -r extension.zip manifest.json fantasy-sweat.html popup.css popup.js icons

      - uses: actions/setup-node@v5
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 22

      - name: Upload and publish
        if: steps.version.outputs.publish == 'true'
        run: npx --yes chrome-webstore-upload-cli@4.0.1 --source extension.zip
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}

      - name: Create the GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already has a release (a re-run) — leaving it as is"
            exit 0
          fi
          # This version's section of CHANGELOG.md ("## 1.2.3 — date" up to the next "## "), if there is one;
          # gh adds the list of pull requests merged since the previous release after it.
          awk -v heading="## $VERSION" 'index($0, heading) == 1 && (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " ") { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "No CHANGELOG.md section for $VERSION — the release lists merged pull requests only"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md --generate-notes
