<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fantasy Sweat</title>
  <!-- For the website copy, added to a phone's Home Screen: its name, icon and colors. The extension ignores all of it. -->
  <link rel="manifest" href="app.webmanifest">
  <link rel="apple-touch-icon" href="web/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fantasy Sweat">
  <meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand" id="brand" role="button" tabindex="0">
      <span class="logo">FS</span>
      <div>
        <div class="title">Fantasy Sweat <span id="devTag" class="dev-tag" title="Unpacked copy from a local folder, not the Chrome Web Store version" hidden>DEV</span></div>
        <div class="sub" id="sub">Who to cheer, who to boo</div>
      </div>
    </div>
    <div class="controls">
      <select id="week" title="Week"></select>
      <button id="refresh" title="Refresh">&#x21bb;</button>
      <button id="popout" title="Pop out into its own window">&#x29C9;</button>
      <button id="expand" title="Open in a full tab">&#x2197;</button>
      <button id="settings" title="Settings">&#x2699;</button>
    </div>
  </header>

  <form id="setup" class="setup" hidden>
    <div id="discardPrompt" class="discard" role="alert" hidden>
      <div>You have unsaved changes. Leave Settings without saving them?</div>
      <div class="row">
        <button type="button" id="discardKeep" class="ghost">Keep editing</button>
        <button type="button" id="discardLeave" class="primary">Discard changes</button>
      </div>
    </div>
    <label for="username">Sleeper username <span class="opt">(optional if you add an ESPN league)</span></label>
    <input id="username" autocomplete="off" spellcheck="false" placeholder="e.g. Rakii" maxlength="30"
           pattern="[A-Za-z0-9_]+" title="Letters, numbers and underscores only">
    <div id="userHint" class="hint" hidden></div>
    <div class="setup-h">ESPN leagues <span>— public leagues only for now</span></div>
    <div id="espnList"></div>
    <div class="row espn-add">
      <input id="espnId" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="ESPN league ID (the number after leagueId=)">
      <button type="button" id="espnAdd" class="ghost">Add</button>
    </div>
    <div id="espnHint" class="hint" hidden></div>
    <div id="nickSection" hidden>
      <div class="setup-h">Leagues <span>— uncheck to hide one; the short nickname shows on player chips (click it to change the color)</span></div>
      <div id="nicks"></div>
    </div>
    <div class="setup-h">Display</div>
    <label class="check-row" for="sortClose">
      <input type="checkbox" id="sortClose">
      <span>Order league cards by closest matchup <span class="opt">(nearest 50/50 first)</span></span>
    </label>
    <label class="check-row" for="tagTitles">
      <input type="checkbox" id="tagTitles">
      <span>Title league cards with the league's nickname <span class="opt">(leagues without a nickname keep their name)</span></span>
    </label>
    <label class="check-row pick-row" for="cardCounts">
      <span>On league cards, show <span class="opt">(who's on the field now, and who hasn't kicked off)</span></span>
      <select id="cardCounts">
        <option value="yet">Only yet to play</option>
        <option value="play">Only in play</option>
        <option value="play-live">In play on the Live plays tab, yet to play elsewhere</option>
        <option value="both-live">Both on the Live plays tab, yet to play elsewhere</option>
        <option value="both">Always both</option>
        <option value="none">None</option>
      </select>
    </label>
    <label class="check-row pick-row" for="gameSort">
      <span>Order games within a kickoff window by <span class="opt">(windows stay in order: Thursday, 1:00, 4:00, Sunday night, Monday)</span></span>
      <select id="gameSort">
        <option value="points">Projected points in play</option>
        <option value="players">Players in the game</option>
      </select>
    </label>
    <div class="row actions">
      <button type="button" id="cancelSetup" class="ghost" hidden>Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
    <div id="appVersion" class="app-version" hidden></div>
  </form>

  <div id="status" class="status" hidden></div>

  <main id="app" hidden>
    <div id="updateBar" class="update-bar" role="status" hidden></div>
    <div id="sinceBar" class="since-bar" role="status" hidden></div>
    <section id="leagues" class="leagues"></section>
    <div id="mustwatch" class="mustwatch" hidden></div>
    <nav class="tabs">
      <button data-view="games" class="on">By game</button>
      <button data-view="players">By player</button>
      <button data-view="teams">By NFL team</button>
      <button data-view="plays">Live plays</button>
      <button data-view="bench">Bench</button>
    </nav>
    <div class="filter">
      <label for="window">Show</label>
      <select id="window" title="Filter by kickoff time"></select>
      <button id="leagueChip" class="lchip" title="Show all leagues again" hidden></button>
    </div>
    <section id="view"></section>
  </main>

  <div id="roster" class="roster" hidden></div>
  <div id="breakdown" class="roster breakdown" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
